name: CI - Sales Forecasting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Airflow image
        run: docker build -t sales-forecasting-airflow:latest -f Dockerfile.airflow .

      - name: Start stack & wait
        run: docker compose up -d --wait --wait-timeout 180   # up to 3 min timeout

      - name: Extra safety wait for Airflow init
        run: sleep 20

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans